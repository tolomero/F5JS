<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS/TS Playground - Estilo RunJS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cambiamos el orden y la forma de carga -->
    <script>
        // Truco definitivo para Electron: ocultamos el 'require' de Node temporalmente
        // para que Monaco no se confunda e intente cargar archivos locales.
        window.nodeRequire = window.require;
        window.require = undefined;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>

    <style>
        body, html, #root { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            background-color: #1e1e1e; color: #fff; overflow: hidden;
        }
        
        #editor-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        .inline-log-decoration {
            opacity: 0.6;
            font-style: italic;
            color: #4ec9b0;
            padding-left: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const formatValue = (v) => {
            try {
                if (v === null) return 'null';
                if (v === undefined) return 'undefined';
                if (typeof v === 'object') return JSON.stringify(v);
                return String(v);
            } catch(e) { return '[Object]'; }
        };

        const App = () => {
            const [code, setCode] = useState("const x = 10;\nconsole.log(x);");
            const [logs, setLogs] = useState([]);
            const [isReady, setIsReady] = useState(false);
            const editorRef = useRef(null);
            const monacoRef = useRef(null);
            const decorationsRef = useRef([]);

            useEffect(() => {
                // Configuramos el cargador de Monaco (que ahora es el único 'require' disponible)
                window.require.config({
                    paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }
                });

                // Cargamos el editor
                window.require(['vs/editor/editor.main'], function() {
                    monacoRef.current = monaco;
                    
                    const container = document.getElementById('editor-container');
                    if (!container) return;

                    editorRef.current = monaco.editor.create(container, {
                        value: code,
                        language: 'javascript',
                        theme: 'vs-dark',
                        automaticLayout: true,
                        fontSize: 15,
                        minimap: { enabled: false },
                        scrollBeyondLastLine: false,
                        lineNumbers: "on",
                        readOnly: false,
                        domReadOnly: false,
                        fixedOverflowWidgets: true
                    });

                    // Devolvemos el require de Node a la normalidad si es necesario para otros procesos
                    if (window.nodeRequire) {
                        window.require = window.nodeRequire;
                    }

                    setTimeout(() => {
                        editorRef.current.focus();
                    }, 500);

                    setIsReady(true);

                    editorRef.current.onDidChangeModelContent(() => {
                        setCode(editorRef.current.getValue());
                    });
                });

                return () => editorRef.current?.dispose();
            }, []);

            const runCode = useCallback(() => {
                const currentLogs = [];
                try {
                    const js = Babel.transform(code, { presets: ['env'] }).code;
                    const mockConsole = {
                        log: (...args) => currentLogs.push(args.map(formatValue).join(' '))
                    };
                    new Function('console', js)(mockConsole);
                } catch (e) {
                    currentLogs.push("Error: " + e.message);
                }
                setLogs(currentLogs);

                if (editorRef.current && monacoRef.current) {
                    const model = editorRef.current.getModel();
                    const lineCount = model.getLineCount();
                    const decs = [];
                    
                    let logIdx = 0;
                    for(let i = 1; i <= lineCount; i++) {
                        if(model.getLineContent(i).includes('console.log') && currentLogs[logIdx]) {
                            decs.push({
                                range: new monacoRef.current.Range(i, 1, i, 1),
                                options: { 
                                    isWholeLine: false,
                                    after: { 
                                        content: `  // ${currentLogs[logIdx]}`, 
                                        inlineClassName: 'inline-log-decoration' 
                                    } 
                                }
                            });
                            logIdx++;
                        }
                    }
                    decorationsRef.current = editorRef.current.deltaDecorations(decorationsRef.current, decs);
                }
            }, [code]);

            useEffect(() => {
                const t = setTimeout(runCode, 500);
                return () => clearTimeout(t);
            }, [code, runCode]);

            return (
                <div className="flex flex-col h-full w-full bg-[#1e1e1e]">
                    <div className="h-10 bg-[#252526] flex items-center px-4 justify-between border-b border-[#333]">
                        <div className="flex items-center gap-2">
                            <div className="w-5 h-5 bg-yellow-500 rounded text-black font-bold text-[10px] flex items-center justify-center">JS</div>
                            <span className="text-xs font-medium text-gray-300">RunJS Clone - {isReady ? 'Listo' : 'Cargando Editor...'}</span>
                        </div>
                    </div>
                    <div className="flex flex-1 overflow-hidden">
                        <div className="w-1/2 h-full" onClick={() => editorRef.current?.focus()}>
                            <div id="editor-container"></div>
                        </div>
                        <div className="w-1/2 h-full bg-[#1e1e1e] border-l border-[#333] p-4 font-mono text-sm overflow-auto">
                            {logs.map((l, i) => (
                                <div key={i} className="text-gray-400 mb-1 border-b border-[#2a2a2a] pb-1">
                                    <span className="text-blue-500 mr-2 opacity-50">›</span> {l}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
